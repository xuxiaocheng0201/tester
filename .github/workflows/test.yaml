name: Test

permissions:
  contents: read

on:
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: Set Openssl
        run: |
          echo "OPENSSL_DIR=C:\Program Files\OpenSSL" >> $env:GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run test
        run: cargo test
